name: CI

on:
  push:
    branches: ['**']
  pull_request:

# CI must never require real production secrets — everything here uses
# throwaway local values for an ephemeral database.
jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tenant isolation & RLS must be verified as a NON-superuser role.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: raqmi_dawam_test
      DB_USERNAME: raqmi
      DB_PASSWORD: raqmi_ci_password
      DB_ENABLE_RLS: 'true'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, bcmath, redis
          coverage: none

      - name: Create non-superuser DB role and test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE raqmi LOGIN PASSWORD 'raqmi_ci_password' NOSUPERUSER NOCREATEROLE NOBYPASSRLS CREATEDB;"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE raqmi_dawam_test OWNER raqmi;"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run migrations (validates schema + RLS)
        run: php artisan migrate --force

      - name: Run tests (isolation, auth, authorization, audit, localization)
        run: php artisan test

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
